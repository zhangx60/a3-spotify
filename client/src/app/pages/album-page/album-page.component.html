@if(album) {
	<div class="row">
		<div class="col-12 col-sm-6">
			<h1>{{ album.name }}</h1>
			<img id="albumImg" [src]="album.imageURL" [alt]="album.name">
			<app-thermometer [popularity]="album.popularity"></app-thermometer>
			@for(artist of album.artists; track artist.id) {
				<p>Artist: <a [routerLink]="['/artist', artist.id]">{{ artist.name }}</a></p>
			}
			<p>
				<a class="btn btn-light" role="button" target="_blank" rel="noopener noreferrer" [href]="album.url">Open {{ album.name }} on Spotify</a>
			</p>
		</div>
		<div class="col-12 col-sm-6">
			<h3>Album Tracks</h3>
			<!--TODO: display the track list for the album. Hide the artist and album columns because they are redundant on this page.-->
		</div>
	</div>
}
